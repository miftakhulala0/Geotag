<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geotag Photo Overlay</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {box-sizing: border-box; font-family: Arial, sans-serif;}
    body {background-color: #f4f6f9; margin: 0; padding: 20px;}
    .container {max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    .form-group {margin-bottom: 15px;}
    .form-row {display: flex; gap: 10px;}
    .form-row .form-group {flex: 1;}
    label {display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
    input[type="text"], input[type="date"], input[type="time"], textarea, input[type="file"] {width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;}
    #map {height: 250px; width: 100%; border-radius: 5px; margin-top: 5px; border: 1px solid #ccc;}
    .loading-text {font-size: 12px; color: #007bff; margin-top: 4px; display: none;}
    button, .btn-download {display: inline-block; width: 100%; background-color: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-top: 10px;}
    button:hover, .btn-download:hover {background-color: #0056b3;}
    .preview-container {width: 100%; overflow-x: auto; text-align: center; margin-top: 15px;}
    canvas {max-width: 100%; height: auto; border-radius: 5px; border: 1px solid #ddd;}
    @media screen and (max-width: 600px) {
      body {padding: 10px;}
      .container {padding: 15px; border-radius: 6px;}
      .form-row {flex-direction: column; gap: 0;}
      h2 {font-size: 20px; text-align: center;}
      #map {height: 200px;}
      button, .btn-download {padding: 14px; font-size: 15px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Geotag Overlay Generator</h2>
    <div class="form-group">
      <label for="imageInput">1. Upload Foto:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <div class="form-group">
      <label>2. Pilih Lokasi di Peta (Klik/Geser Marker untuk Koordinat Otomatis):</label>
      <div id="map"></div>
      <div id="loadingText" class="loading-text">Mengambil data alamat & zona waktu...</div>
    </div>
    <div class="form-group">
      <label for="addressInput">3. Nama Kecamatan / Kota (Judul Utama):</label>
      <input type="text" id="addressInput" placeholder="Kecamatan Sukolilo, Jawa Timur, Indonesia">
    </div>
    <div class="form-group">
      <label for="detailInput">4. Alamat Lengkap / Detail:</label>
      <textarea id="detailInput" rows="3" placeholder="Pq9v+26m, Keputih, Kec. Sukolilo, Surabaya..."></textarea>
    </div>
    <div class="form-group">
      <label for="latLongInput">5. Koordinat (Lat, Long):</label>
      <input type="text" id="latLongInput" placeholder="Lat -7.282303° Long 112.793312°">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="dateInput">6. Tanggal:</label>
        <input type="date" id="dateInput">
      </div>
      <div class="form-group">
        <label for="timeInput">7. Waktu / Jam:</label>
        <input type="time" id="timeInput">
      </div>
    </div>
    <button id="generateBtn">Generate Geotag Overlay</button>
    <hr>
    <h3>Hasil Foto:</h3>
    <div class="preview-container">
      <canvas id="photoCanvas"></canvas>
    </div>
    <br>
    <a id="downloadBtn" style="display: none;" class="btn-download">Download Gambar</a>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const now = new Date();
    document.getElementById('dateInput').value = now.toISOString().split('T')[0];
    document.getElementById('timeInput').value = now.toTimeString().slice(0, 5);
    let currentLat = -7.282303;
    let currentLng = 112.793312;
    let currentCountryCode = 'id';
    let currentGmtOffset = '+07:00';
    const map = L.map('map').setView([currentLat, currentLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
    let marker = L.marker([currentLat, currentLng], { draggable: true }).addTo(map);
    function updateLocationData(lat, lng) {
      currentLat = lat;
      currentLng = lng;
      document.getElementById('latLongInput').value = `Lat ${lat.toFixed(6)}° Long ${lng.toFixed(6)}°`;
      const estimatedOffset = Math.round(lng / 15);
      const sign = estimatedOffset >= 0 ? '+' : '-';
      const absOffset = Math.abs(estimatedOffset).toString().padStart(2, '0');
      currentGmtOffset = `${sign}${absOffset}:00`; 
      fetchAddress(lat, lng);
    }
    async function fetchAddress(lat, lng) {
      const loadingText = document.getElementById('loadingText');
      loadingText.style.display = 'block';
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await response.json();
        if (data && data.address) {
          const addr = data.address;
          currentCountryCode = addr.country_code ? addr.country_code.toLowerCase() : 'id';
          const district = addr.subdistrict || addr.district || addr.city_district || addr.town || addr.city || '';
          const state = addr.state || '';
          const country = addr.country || '';
          let mainTitle = '';
          if (district) mainTitle += `Kecamatan ${district}, `;
          if (state) mainTitle += `${state}, `;
          if (country) mainTitle += country;
          document.getElementById('addressInput').value = mainTitle;
          document.getElementById('detailInput').value = data.display_name;
        }
      } catch (err) {
        console.error("Gagal mengambil data alamat:", err);
      } finally {
        loadingText.style.display = 'none';
      }
    }
    updateLocationData(currentLat, currentLng);
    map.on('click', function(e) {
      marker.setLatLng(e.latlng);
      updateLocationData(e.latlng.lat, e.latlng.lng);
    });
    marker.on('dragend', function(e) {
      const position = marker.getLatLng();
      updateLocationData(position.lat, position.lng);
    });
    function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
    }
    function wrapText(ctx, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let currentLine = words[0] || '';
      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }
    const imageInput = document.getElementById('imageInput');
    const generateBtn = document.getElementById('generateBtn');
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    function formatDateIndo(dateStr, timeStr, gmtStr) {
      if (!dateStr) return '';
      const dateObj = new Date(`${dateStr}T${timeStr || '00:00'}`);
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const dayName = days[dateObj.getDay()];
      const day = String(dateObj.getDate()).padStart(2, '0');
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const year = dateObj.getFullYear();
      let hours = dateObj.getHours();
      const minutes = String(dateObj.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const formattedHours = String(hours).padStart(2, '0'); 
      return `${dayName}, ${day}/${month}/${year} ${formattedHours}:${minutes} ${ampm} GMT ${gmtStr}`;
    }
    generateBtn.addEventListener('click', () => {
      const file = imageInput.files[0];
      if (!file) {
        alert('Silakan upload foto terlebih dahulu!');
        return;
      }
      generateBtn.innerText = 'Memproses...';
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const scale = img.width / 1300;
          const detail = document.getElementById('detailInput').value || '';
          ctx.font = `${Math.round(18 * scale)}px Arial`;
          const boxWidth = 1000 * scale;
          const tempMapSize = 140 * scale; 
          const maxDetailWidth = boxWidth - tempMapSize - (120 * scale);
          const detailLines = wrapText(ctx, detail, maxDetailWidth).slice(0, 3);
          const lineCount = detailLines.length;
          const mapSize = (130 + (lineCount * 18)) * scale; 
          const boxHeight = mapSize + (40 * scale);         
          const boxMarginLeft = 145 * scale;
          const boxMarginBottom = 30 * scale;
          const boxX = boxMarginLeft;
          const boxY = canvas.height - boxMarginBottom - boxHeight;
          drawRoundedRect(ctx, boxX, boxY, boxWidth, boxHeight, 18 * scale, 'rgba(20, 20, 20, 0.78)');
          const mapX = boxX + (25 * scale);
          const mapY = boxY + (boxHeight - mapSize) / 2;
          const zoom = 18;
          const latRad = currentLat * Math.PI / 180;
          const n = Math.pow(2, zoom);
          const exactX = (currentLng + 180) / 360 * n;
          const exactY = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
          const centerTileX = Math.floor(exactX);
          const centerTileY = Math.floor(exactY);
          const offsetX = (exactX - centerTileX) * 256;
          const offsetY = (exactY - centerTileY) * 256;
          const tileImages = [];
          let loadedTilesCount = 0;
          const totalTiles = 9;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const tileImg = new Image();
              tileImg.crossOrigin = "anonymous";
              tileImg.src = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${centerTileY + dy}/${centerTileX + dx}`;
              tileImages.push({
                img: tileImg,
                dx: dx,
                dy: dy
              });
              tileImg.onload = checkAllAssets;
              tileImg.onerror = checkAllAssets;
            }
          }
          const flagImg = new Image();
          flagImg.crossOrigin = "anonymous";
          flagImg.src = `https://flagcdn.com/w80/${currentCountryCode}.png`;
          let hasRendered = false;
          let flagLoaded = false;
          flagImg.onload = () => { flagLoaded = true; checkAllAssets(); };
          flagImg.onerror = () => { flagLoaded = true; checkAllAssets(); };
          const renderTimeout = setTimeout(() => {
            if (!hasRendered) {
              hasRendered = true;
              renderMapAndDetails(tileImages, flagImg);
            }
          }, 3500);
          function checkAllAssets() {
            loadedTilesCount++;
            if (loadedTilesCount >= totalTiles && flagLoaded && !hasRendered) {
              hasRendered = true;
              clearTimeout(renderTimeout);
              renderMapAndDetails(tileImages, flagImg);
            }
          }
          function renderMapAndDetails(tiles, flagElement) {
            ctx.save();
            drawRoundedRect(ctx, mapX, mapY, mapSize, mapSize, 10 * scale, null);
            ctx.clip();
            const zoomScale = mapSize / 256;
            let drawSuccess = false;
            tiles.forEach(tileObj => {
              if (tileObj.img.complete && tileObj.img.naturalWidth !== 0) {
                const drawX = mapX + (mapSize / 2) - (offsetX * zoomScale) + (tileObj.dx * 256 * zoomScale);
                const drawY = mapY + (mapSize / 2) - (offsetY * zoomScale) + (tileObj.dy * 256 * zoomScale);
                ctx.drawImage(tileObj.img, drawX, drawY, 256 * zoomScale, 256 * zoomScale);
                drawSuccess = true;
              }
            });
            if (!drawSuccess) {
              ctx.fillStyle = '#1c2e1b';
              ctx.fillRect(mapX, mapY, mapSize, mapSize);
              ctx.fillStyle = '#2d472a';
              ctx.fillRect(mapX + 10*scale, mapY + 10*scale, mapSize - 20*scale, mapSize - 20*scale);
            }
            ctx.restore();
            const pinScale = mapSize / (180 * scale);
            const pinX = mapX + (mapSize / 2);
            const pinY = mapY + (mapSize / 2);
            ctx.beginPath();
            ctx.arc(pinX, pinY - (12 * scale * pinScale), 11 * scale * pinScale, 0, Math.PI * 2);
            ctx.fillStyle = '#ea4335';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(pinX, pinY - (12 * scale * pinScale), 4 * scale * pinScale, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pinX - (8 * scale * pinScale), pinY - (5 * scale * pinScale));
            ctx.lineTo(pinX + (8 * scale * pinScale), pinY - (5 * scale * pinScale));
            ctx.lineTo(pinX, pinY);
            ctx.closePath();
            ctx.fillStyle = '#ea4335';
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 4 * scale;
            ctx.font = `bold ${Math.round(18 * pinScale * scale)}px sans-serif`;
            ctx.fillText('Google', mapX + (10 * scale), mapY + mapSize - (10 * scale));
            ctx.shadowBlur = 0;
            const badgeX = boxX + boxWidth - (200 * scale);
            const badgeY = boxY + (16 * scale);
            drawRoundedRect(ctx, badgeX, badgeY, 180 * scale, 30 * scale, 6 * scale, 'rgba(0, 0, 0, 0.5)');
            drawRoundedRect(ctx, badgeX + (8 * scale), badgeY + (5 * scale), 18 * scale, 18 * scale, 4 * scale, '#4285f4');
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(badgeX + (17 * scale), badgeY + (14 * scale), 4 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.round(14 * scale)}px Arial`;
            ctx.fillText('GPS Map Camera', badgeX + (34 * scale), badgeY + (20 * scale));
            const textX = mapX + mapSize + (25 * scale);
            let currentY = boxY + (38 * scale);
            const title = document.getElementById('addressInput').value || 'Lokasi Geotag';
            ctx.fillStyle = '#ffffff';
            ctx.font = `500 ${Math.round(26 * scale)}px Arial`;
            ctx.fillText(title, textX, currentY);
            currentY += 15 * scale;
            const flagY = currentY;
            if (flagElement && flagElement.complete && flagElement.naturalWidth !== 0) {
              ctx.drawImage(flagElement, textX, flagY, 30 * scale, 18 * scale);
            } else {
              drawRoundedRect(ctx, textX, flagY, 30 * scale, 17 * scale, 3 * scale, null);
              ctx.fillStyle = '#ff0000';
              ctx.fillRect(textX, flagY, 30 * scale, 8.5 * scale);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(textX, flagY + (8.5 * scale), 30 * scale, 8.5 * scale);
            }
            currentY += 30 * scale;
            ctx.fillStyle = '#e6e6e6';
            ctx.font = `${Math.round(16 * scale)}px Arial`;
            detailLines.forEach(line => {
              ctx.fillText(line, textX, currentY);
              currentY += 21 * scale;
            });
            const formattedCoord = document.getElementById('latLongInput').value;
            ctx.fillStyle = '#ffffff';
            ctx.font = `${Math.round(16 * scale)}px Arial`;
            ctx.fillText(formattedCoord, textX, currentY);
            currentY += 21 * scale;
            const dateVal = document.getElementById('dateInput').value;
            const timeVal = document.getElementById('timeInput').value;
            const formattedDateTime = formatDateIndo(dateVal, timeVal, currentGmtOffset);
            ctx.fillText(formattedDateTime, textX, currentY);
            downloadBtn.href = canvas.toDataURL('image/jpeg', 0.95);
            downloadBtn.download = `geotag_${Date.now()}.jpg`;
            downloadBtn.style.display = 'block';
            generateBtn.innerText = 'Generate Geotag Overlay';
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
